name: Contribution CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PR code runs only on disposable GitHub-hosted runners, without write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coach-lua:
    name: Coach Lua
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      # the Relax Raid runner tests build throwaway Go modules: the job's own Go, not the runner image's
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Install pinned Lua harness dependency
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: Existing Coach harness
        run: env -u SV_OUT python -I -B test/harness.py
      - name: Existing reaction tests
        run: python -I -B test/reactions_test.py
      - name: Gear advice, both GearQuest layouts
        run: python -I -B test/gear_test.py
      - name: Gear advice mutants
        run: python -I -B test/gear_mutants.py
      - name: Required CI gate regression tests
        run: python -I -B .github/tests/test_check_results.py
      - name: Quest and item review (pinned data, no donor execution)
        env:
          CLEANUP_USES_ZIP: ${{ runner.temp }}/KeepOrToss-1.7.0.zip
        run: |
          curl --fail --location --retry 2 --max-time 90 -o "$CLEANUP_USES_ZIP" https://mediafilez.forgecdn.net/files/9575/258/KeepOrToss-1.7.0.zip
          python -I -B tools/gen_cleanup_uses.py "$CLEANUP_USES_ZIP" --check
          for t in cleanup_data_test cleanup_snapshot_test cleanup_uses_test cleanup_policy_test cleanup_lifecycle_test cleanup_ui_test cleanup_static_test cleanup_mutation_test; do
            python -I -B test/planner/$t.py
          done
      - name: Relax Quest Planner tests (private-data suites skip on CI)
        run: |
          for t in ui_shell_test bridge_skip_test journey_integration journey_picker engine_test journey_private nil_quest_test refresh_correctness_test journal_test dungeon_route_test; do
            python -I -B test/planner/$t.py
          done
      - name: Relax Raid modules (Lua and Python)
        run: python -I -B tools/raidtest.py --all --kind lua,py
      - name: Relax Raid Lua mutation guards
        run: |
          for module in core log prep wire store; do
            python -I -B tools/raidtest.py --mutants "$module"
          done

  desktop-go:
    name: Desktop Go and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Existing Go tests with race detection
        env:
          NATIVE_HTML_OUT: ${{ runner.temp }}/relax-coach-native.html
          FARM_HTML_OUT: ${{ runner.temp }}/relax-coach-farm.html
        working-directory: desktop
        run: go test -race -count=1 -timeout 20m ./...
      - name: Go vet
        working-directory: desktop
        run: go vet ./...
      - name: Relax Raid modules (Go)
        run: python3 -I -B tools/raidtest.py --all --kind go
      - name: Install locked UI test dependencies without lifecycle scripts
        run: npm ci --prefix .github --ignore-scripts
      - name: Existing offline UI tests
        env:
          NODE_PATH: ${{ github.workspace }}/.github/node_modules
          NATIVE_HTML_OUT: ${{ runner.temp }}/relax-coach-native.html
          FARM_HTML_OUT: ${{ runner.temp }}/relax-coach-farm.html
        run: node --test desktop/*_ui_test.cjs

  bundle-contract:
    name: Bundle contract and Windows cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # real old-app acceptance/refusal probes archive published tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Cross-compile a private Windows build (never upload or publish)
        working-directory: desktop
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags '-H windowsgui' -o ../dist/RelaxCoach.exe .
      - name: Build a private guild archive (never upload or publish)
        run: python scripts/build_guild_bundle.py --exe dist/RelaxCoach.exe
      - name: Existing bundle contract tests
        run: python -I -B test/test_guild_bundle.py
      - name: Release gate selection and real current-bundle compatibility (fail closed)
        run: python -I -B test/test_release_gate.py

  required-ci:
    # Keep this check name stable: the main ruleset requires its GitHub Actions result.
    name: Required CI
    if: ${{ always() }}
    needs: [coach-lua, desktop-go, bundle-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject failed, cancelled, skipped or absent upstream jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -I -B .github/scripts/check_results.py
